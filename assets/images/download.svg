<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
	<title id="title">ARCN page image placeholder</title>
	<desc id="description">Placeholder image used until a page image is selected.</desc>

	<rect width="1200" height="600" fill="#eeeeee"></rect>

	<line x1="0" y1="0" x2="1200" y2="600" stroke="#dddddd" stroke-width="2"></line>

	<line x1="1200" y1="0" x2="0" y2="600" stroke="#dddddd" stroke-width="2"></line>

	<text x="600" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#555555">
		Page image
	</text>

	<text x="600" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#777777">
		Click image → Replace
	</text>
</svg>